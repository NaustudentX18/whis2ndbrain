<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Pip, the Whis2ndBrain memory moth</title>
  <desc id="desc">A friendly 3D-inspired mint-and-lilac moth with glowing wings, a round face, tiny antennae and a soft floating shadow.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="43%" r="55%"><stop stop-color="#A9F3D4" stop-opacity=".24"/><stop offset="1" stop-color="#A9F3D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="leftWing" x1="88" y1="186" x2="240" y2="367" gradientUnits="userSpaceOnUse"><stop stop-color="#F1FFF0"/><stop offset=".45" stop-color="#B9F4DB"/><stop offset="1" stop-color="#6FC8B7"/></linearGradient>
    <linearGradient id="rightWing" x1="260" y1="203" x2="435" y2="358" gradientUnits="userSpaceOnUse"><stop stop-color="#F7F1FF"/><stop offset=".47" stop-color="#C5B8FF"/><stop offset="1" stop-color="#8474D8"/></linearGradient>
    <radialGradient id="body" cx="35%" cy="22%" r="80%"><stop stop-color="#F5FFE8"/><stop offset=".34" stop-color="#BDEFD5"/><stop offset=".72" stop-color="#6DBFAF"/><stop offset="1" stop-color="#428D86"/></radialGradient>
    <radialGradient id="face" cx="37%" cy="26%" r="76%"><stop stop-color="#FFFCEB"/><stop offset=".55" stop-color="#E8F8E7"/><stop offset="1" stop-color="#B3DDD0"/></radialGradient>
    <linearGradient id="antenna" x1="199" y1="95" x2="306" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="#C6FFE2"/><stop offset="1" stop-color="#9D8CEB"/></linearGradient>
    <radialGradient id="orb" cx="34%" cy="25%" r="80%"><stop stop-color="#FFF8D4"/><stop offset=".48" stop-color="#BCFFD8"/><stop offset="1" stop-color="#74CFB7"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <ellipse cx="260" cy="455" rx="129" ry="25" fill="#11191E" opacity=".18" filter="url(#shadow)"/>
  <circle cx="260" cy="259" r="220" fill="url(#halo)"/>
  <circle cx="401" cy="117" r="22" fill="#BFFFE0" opacity=".35" filter="url(#softGlow)"/>
  <circle cx="401" cy="117" r="6" fill="#D9FFE9"/><circle cx="111" cy="223" r="4" fill="#D7CAFF"/><path d="m112 315 5 10 11 2-9 7 2 11-9-6-10 5 3-11-8-8 11-1 4-9Z" fill="#F7E9A9" opacity=".9"/>
  <!-- wings: softly sculpted, translucent and deliberately not insect-realistic -->
  <path d="M238 253c-67-98-146-104-165-42-16 53 17 127 78 152 42 17 82-5 100-50" fill="url(#leftWing)" stroke="#E8FFF0" stroke-opacity=".78" stroke-width="4"/>
  <path d="M277 252c54-99 136-111 164-55 26 51-2 129-62 163-40 23-82 4-104-39" fill="url(#rightWing)" stroke="#F2EFFF" stroke-opacity=".85" stroke-width="4"/>
  <path d="M111 222c46 1 84 27 113 77M114 282c47-4 78 7 111 30M389 216c-45 7-78 35-105 82M404 277c-42-3-76 9-116 35" fill="none" stroke="#F8FFF4" stroke-opacity=".47" stroke-width="4" stroke-linecap="round"/>
  <path d="M201 166c-24-38-29-66-12-80 15-12 36 10 54 54M319 166c23-37 26-66 10-79-16-12-36 8-54 52" fill="none" stroke="url(#antenna)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="183" cy="81" r="10" fill="#BDF6D7"/><circle cx="329" cy="82" r="10" fill="#C4B8FF"/>
  <ellipse cx="260" cy="291" rx="90" ry="125" fill="url(#body)" stroke="#E8FFF0" stroke-opacity=".68" stroke-width="4"/>
  <ellipse cx="260" cy="222" rx="77" ry="72" fill="url(#face)"/>
  <path d="M221 236c6-9 14-13 23-13M298 236c-6-9-14-13-23-13" fill="none" stroke="#546B69" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="215" cy="250" rx="13" ry="7" fill="#F3A8A5" opacity=".64"/><ellipse cx="305" cy="250" rx="13" ry="7" fill="#F3A8A5" opacity=".64"/>
  <path d="M250 257c4 8 16 8 20 0" fill="none" stroke="#667C73" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 330c18 14 48 17 69 0" fill="none" stroke="#EFFFF1" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <circle cx="260" cy="359" r="24" fill="url(#orb)" opacity=".85"/>
  <path d="M260 344c3 7 7 11 14 14-7 3-11 7-14 14-3-7-7-11-14-14 7-3 11-7 14-14Z" fill="#FFFBE6"/>
  <path d="M209 408c13 11 31 17 51 17s38-6 51-17" fill="none" stroke="#9BE1C4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
