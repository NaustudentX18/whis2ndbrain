name: whis_app
description: "Whis2ndBrain — voice capture & second brain, Android-first."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP + auth
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  # Audio playback
  just_audio: ^0.9.40
  # Local preferences (non-secret: host URL for display etc.)
  shared_preferences: ^2.3.2
  # Google Sign-In for Drive integration
  google_sign_in: ^6.2.1
  # Drive API
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  # Intl / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
