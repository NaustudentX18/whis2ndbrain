name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit tests & lint (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: |
          find server contracts device -name "*.py" -print0 \
            | xargs -0 python -m py_compile

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v

  flutter:
    name: Flutter build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Flutter test
        working-directory: app
        run: flutter test

      - name: Flutter build APK (debug)
        working-directory: app
        run: flutter build apk --debug --no-pub
